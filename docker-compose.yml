# Development stack: PostgreSQL, API, and Vite with hot reload.
# Open http://localhost:5173 for frontend development, or :8000 for the built app/API.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: casino
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed:/docker-entrypoint-initdb.d:ro   # runs *.sql the first time the volume is created
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d casino"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/casino
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/casino_test
      WEB_DIR: /web/dist
    volumes:
      - ./api/app:/srv/app
      - ./api/scripts:/srv/scripts
      - ./api/alembic:/srv/alembic
      - ./api/alembic.ini:/srv/alembic.ini
      - ./api/tests:/srv/tests
      - ./web/dist:/web/dist:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./web:/web
      - web_node_modules:/web/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
